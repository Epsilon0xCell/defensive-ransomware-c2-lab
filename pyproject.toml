[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "defensive-lab-combined"
version = "2.0.0"
description = "Defensive security lab: fake C2 simulator plus fake ransomware simulator with detection engineering, for education only."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools]
packages = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
