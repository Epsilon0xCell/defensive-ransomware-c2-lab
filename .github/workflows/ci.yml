name: lab-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('sigma/*.yml')]; print('sigma yaml ok')"
      - run: pytest -q
